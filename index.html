<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Advanced Face Recognition</title>
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(90deg, rgba(6, 53, 108, 1) 6%, rgba(10, 82, 92, 1) 54%, rgba(27, 115, 131, 1) 92%);
            color: white;
        }

        video {
            border-radius: 10px;
            margin-top: 20px;
            display: block;
            width: 720px;
            height: 560px;
        }

        canvas {
            position: absolute;
            top: 20px;
            /* Match video margin-top */
            left: calc(50% - 360px);
            /* Center with video width/2 */
        }

        #controls {
            margin-top: 20px;
        }

        h1 {
            font-size: 2em;
            text-align: center;
            background: linear-gradient(90deg, rgb(0 0 0) 0%, rgba(8, 136, 154, 1) 54%, rgba(3, 71, 83, 1) 92%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input,
        button {
            padding: 8px 12px;
            margin: 5px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }

        input {
            width: 200px;
        }

        button {
            background: linear-gradient(90deg, rgb(0 0 0) 0%, rgba(8, 136, 154, 1) 54%, rgba(3, 71, 83, 1) 92%);
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Advanced Face Recognition</h1>
    <div style="position: relative;">
        <video id="video" autoplay muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div id="controls">
        <button id="start">Start Camera</button>
        <button id="stop">Stop Camera</button>
        <input type="text" id="name" placeholder="Enter name" />
        <button id="register">Register Face</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
